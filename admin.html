<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Kokam Sweets</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card h3 {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }
        .product-manager {
            background: var(--white);
            padding: 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.active { background: #e6f7ef; color: #00a854; }
        .action-btns {
            display: flex;
            gap: 10px;
        }
        .edit-btn { color: #1890ff; }
        .delete-btn { color: #f5222d; }
    </style>
</head>
<body style="background-color: #f8f9fa;">
    <div class="admin-container">
        <div class="admin-header">
            <h1>Product Dashboard</h1>
            <a href="index.html" class="btn-primary">Back to Website</a>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Products</h3>
                <div class="value">24</div>
            </div>
            <div class="stat-card">
                <h3>Categories</h3>
                <div class="value">6</div>
            </div>
            <div class="stat-card">
                <h3>Site Visitors</h3>
                <div class="value">1.2k</div>
            </div>
        </div>

        <div class="product-manager">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Manage Products</h2>
                <button class="btn-primary" style="padding: 8px 20px;">+ Add New</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Panjeeri Ladoo</td>
                        <td>Sweets</td>
                        <td>₹450</td>
                        <td><span class="status active">Active</span></td>
                        <td class="action-btns">
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Special Mix Namkeen</td>
                        <td>Namkeen</td>
                        <td>₹180</td>
                        <td><span class="status active">Active</span></td>
                        <td class="action-btns">
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                    <tr>
                        <td>Premium Atta Biscuits</td>
                        <td>Cookies</td>
                        <td>₹220</td>
                        <td><span class="status active">Active</span></td>
                        <td class="action-btns">
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
